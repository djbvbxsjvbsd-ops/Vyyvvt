name: Build Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o seu código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Baixar o gradlew ausente e preparar
      run: |
        # Baixa o projeto oficial da Forge apenas para pegar o gradlew perdido
        wget -q https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.2.0/forge-1.20.1-47.2.0-mdk.zip -O mdk.zip
        unzip -q mdk.zip -d temp_mdk
        
        # Copia o gradlew e a pasta gradle/wrapper do oficial para o seu projeto
        cp temp_mdk/gradlew .
        cp temp_mdk/gradlew.bat .
        mkdir -p gradle/wrapper
        cp temp_mdk/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
        
        # Dá permissão de execução
        chmod +x gradlew

    - name: Compilar com Gradle
      run: ./gradlew build

    - name: Salvar o arquivo .jar
      uses: actions/upload-artifact@v4
      with:
        name: Valdoria-Mod
        path: build/libs/*.jar
